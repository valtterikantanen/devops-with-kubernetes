apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dwk-project-staging

resources:
  - ../../base/todo-app
  - ../../base/todo-backend
  - ../../base/todo-broadcaster
  - todo-backend/sealed-secret.yaml

images:
  - name: TODO_APP_IMAGE
    newName: vkantanen/todo-app-project:4.05
  - name: TODO_BACKEND_IMAGE
    newName: vkantanen/todo-app-backend:4.06
  - name: TODO_BROADCASTER_IMAGE
    newName: vkantanen/todo-broadcaster:4.06
  - name: TODO_CRON_IMAGE
    newName: vkantanen/todo-cron:4.08
